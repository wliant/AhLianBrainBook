# The single entrypoint for a BrainBook environment. Everything the browser
# touches comes through here on one port, so the API is same-origin with the
# UI and no CORS negotiation is involved. app, intelligence-service and
# sandbox-service publish nothing of their own.

# $connection_upgrade is "upgrade" only for a real websocket handshake, and
# empty otherwise so ordinary requests still use keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Honour the scheme an upstream TLS terminator reports, and fall back to the
# scheme this request actually arrived on. Never forwarded empty: Tomcat
# treats a blank header as a malformed request.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Hyphens, not underscores: the name ends up in the Host header when a
# location forgets to set one, and underscores are illegal in a domain name.
upstream brainbook-app {
    server app:8080;
}

upstream brainbook-web {
    server web:3000;
}

server {
    listen 80;
    server_name _;

    # Matches spring.servlet.multipart.max-file-size in application.yml. Set
    # lower here and a 50MB attachment is rejected by nginx before the backend
    # ever sees it.
    client_max_body_size 50m;

    # Attachment uploads stream through; buffering a whole file to disk first
    # only adds latency.
    proxy_request_buffering off;

    # Container healthcheck. Answered here rather than proxied so the edge
    # reports healthy independently of the services behind it.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        include /etc/nginx/proxy_headers.conf;
        proxy_pass http://brainbook-app;

        # AI assist and research progress are SseEmitter streams. With
        # buffering on, nginx holds every stage indicator until the response
        # completes and the UI shows them all at once at the end.
        proxy_buffering off;
        proxy_cache off;
        # The backend's own async timeout is SPRING_MVC_ASYNC_TIMEOUT (600s by
        # default); this sits just above it so the backend is what times a
        # stalled stream out, not the proxy.
        proxy_read_timeout 650s;
        proxy_send_timeout 650s;
        # An empty Connection header keeps the upstream connection keep-alive
        # instead of inheriting the client's "close".
        proxy_set_header Connection "";
    }

    location /actuator/ {
        include /etc/nginx/proxy_headers.conf;
        proxy_pass http://brainbook-app;
        proxy_set_header Connection "";
    }

    location / {
        include /etc/nginx/proxy_headers.conf;
        proxy_pass http://brainbook-web;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }
}
