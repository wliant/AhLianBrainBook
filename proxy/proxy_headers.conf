# Included by every location block. nginx replaces the whole inherited set of
# proxy_set_header directives as soon as a location declares one of its own,
# so these cannot live at server level - without them Host falls back to the
# upstream name and Tomcat rejects the request.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
